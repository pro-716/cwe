<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuxeStore | عالم التسوق الفاخر</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'IBM Plex Sans Arabic', sans-serif; background-color: #050507; color: #fff; }
        .ultra-glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .category-btn.active { background: linear-gradient(to right, #8b5cf6, #d946ef); color: white; box-shadow: 0 0 15px rgba(139, 92, 246, 0.5); }
        .product-card:hover { transform: translateY(-10px); transition: all 0.3s ease; }
    </style>
</head>
<body class="min-h-screen">
    <!-- Background Effects -->
    <div class="fixed inset-0 z-[-1] overflow-hidden pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[600px] h-[600px] bg-violet-900/30 rounded-full blur-[120px]"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[600px] h-[600px] bg-fuchsia-900/30 rounded-full blur-[120px]"></div>
    </div>

    <!-- Login Screen -->
    <div id="loginScreen" class="fixed inset-0 z-[100] ultra-glass flex items-center justify-center p-4 backdrop-blur-3xl">
        <div class="bg-[#0a0a0f] p-8 rounded-3xl border border-white/10 w-full max-w-sm text-center shadow-2xl">
            <div class="text-6xl mb-4">🛍️</div>
            <h2 class="text-3xl font-bold mb-6 bg-gradient-to-r from-violet-400 to-fuchsia-400 bg-clip-text text-transparent">مرحباً بك</h2>
            <input type="text" id="userName" placeholder="الاسم الكامل" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl mb-4 outline-none focus:border-violet-500 transition text-white">
            <input type="tel" id="userPhone" placeholder="رقم الهاتف" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl mb-6 outline-none focus:border-violet-500 transition text-white">
            <button onclick="login()" class="w-full bg-gradient-to-r from-violet-600 to-fuchsia-600 py-4 rounded-2xl font-bold text-lg hover:scale-105 transition-all shadow-lg shadow-violet-500/20">ابدأ التسوق الآن</button>
        </div>
    </div>

    <!-- Navbar -->
    <nav class="sticky top-0 z-40 ultra-glass px-6 py-4 mx-2 md:mx-6 mt-4 rounded-2xl flex justify-between items-center">
        <div class="text-2xl font-bold tracking-tighter">LUXE<span class="text-fuchsia-500">STORE</span></div>
        <div class="flex items-center gap-4">
            <span id="welcomeMsg" class="hidden md:block text-sm text-white/60"></span>
            <button onclick="toggleCart()" class="relative p-3 rounded-full bg-white/5 hover:bg-white/10 transition">
                🛒 <span id="cartCount" class="absolute -top-1 -right-1 bg-fuchsia-500 text-[10px] w-5 h-5 rounded-full flex items-center justify-center">0</span>
            </button>
        </div>
    </nav>

    <!-- All Categories -->
    <div id="categorySection" class="hidden px-4 py-8 overflow-x-auto flex gap-3 justify-start md:justify-center max-w-7xl mx-auto scrollbar-hide">
        <button onclick="filterCategory('all')" class="category-btn active ultra-glass px-6 py-2 rounded-full text-sm font-medium whitespace-nowrap transition-all">الكل ✨</button>
        <button onclick="filterCategory('رجالي')" class="category-btn ultra-glass px-6 py-2 rounded-full text-sm font-medium whitespace-nowrap transition-all">رجالي 👔</button>
        <button onclick="filterCategory('نسائي')" class="category-btn ultra-glass px-6 py-2 rounded-full text-sm font-medium whitespace-nowrap transition-all">نسائي 👗</button>
        <button onclick="filterCategory('أطفال')" class="category-btn ultra-glass px-6 py-2 rounded-full text-sm font-medium whitespace-nowrap transition-all">أطفال 👶</button>
        <button onclick="filterCategory('أحذية')" class="category-btn ultra-glass px-6 py-2 rounded-full text-sm font-medium whitespace-nowrap transition-all">أحذية 👟</button>
        <button onclick="filterCategory('تيشيرتات')" class="category-btn ultra-glass px-6 py-2 rounded-full text-sm font-medium whitespace-nowrap transition-all">تيشيرتات 👕</button>
        <button onclick="filterCategory('إلكترونيات')" class="category-btn ultra-glass px-6 py-2 rounded-full text-sm font-medium whitespace-nowrap transition-all">إلكترونيات 📱</button>
        <button onclick="filterCategory('ساعات')" class="category-btn ultra-glass px-6 py-2 rounded-full text-sm font-medium whitespace-nowrap transition-all">ساعات ⌚</button>
        <button onclick="filterCategory('عطور')" class="category-btn ultra-glass px-6 py-2 rounded-full text-sm font-medium whitespace-nowrap transition-all">عطور ✨</button>
        <button onclick="filterCategory('إكسسوارات')" class="category-btn ultra-glass px-6 py-2 rounded-full text-sm font-medium whitespace-nowrap transition-all">إكسسوارات 💍</button>
        <button onclick="filterCategory('شتوي')" class="category-btn ultra-glass px-6 py-2 rounded-full text-sm font-medium whitespace-nowrap transition-all">شتوي ❄️</button>
        <button onclick="filterCategory('صيفي')" class="category-btn ultra-glass px-6 py-2 rounded-full text-sm font-medium whitespace-nowrap transition-all">صيفي ☀️</button>
    </div>

    <!-- Products Grid -->
    <main id="mainContent" class="hidden p-4 max-w-7xl mx-auto pb-24">
        <div id="productsGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6"></div>
    </main>

    <!-- Cart Drawer -->
    <div id="cartDrawer" class="fixed top-0 left-0 w-full md:w-96 h-full ultra-glass z-50 transform -translate-x-full transition-transform bg-[#09090b]/95 flex flex-col border-r border-white/10">
        <div class="p-6 border-b border-white/10 flex justify-between items-center">
            <h2 class="text-2xl font-bold">سلتك الذكية 🛒</h2>
            <button onclick="toggleCart()" class="text-3xl">&times;</button>
        </div>
        <div id="cartItems" class="flex-1 p-4 overflow-y-auto space-y-3"></div>
        <div class="p-6 border-t border-white/10">
            <div class="flex justify-between text-xl font-bold mb-6"><span>المجموع النهائي:</span><span id="totalPrice" class="text-fuchsia-400">0 د.ع</span></div>
            <button onclick="confirmOrder()" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 py-4 rounded-2xl font-bold text-lg hover:scale-105 transition-all shadow-lg shadow-emerald-500/20">تأكيد الطلب الآن</button>
        </div>
    </div>

    <script type="module">
        import pb from './pocketbase-config.js';

        let user = {};
        let cart = [];
        let allProducts = [];

        window.login = () => {
            const name = document.getElementById('userName').value;
            const phone = document.getElementById('userPhone').value;
            if(!name || !phone) return alert("أكمل البيانات");
            user = { name, phone };
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('categorySection').classList.remove('hidden');
            document.getElementById('mainContent').classList.remove('hidden');
            document.getElementById('welcomeMsg').innerText = `مرحباً، ${name} ✨`;
            document.getElementById('welcomeMsg').classList.remove('hidden');
            loadProducts('all');
        };

        async function loadProducts(cat) {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '<p class="text-center col-span-full text-white/50 py-20">جاري جلب الفخامة... ⏳</p>';
            try {
                let filter = cat === 'all' ? '' : `category='${cat}'`;
                const records = await pb.collection('products').getFullList({ filter: filter });
                allProducts = records;
                renderProducts(cat);
            } catch (e) {
                grid.innerHTML = `<p class="text-center col-span-full text-red-400">حدث خطأ في الاتصال: ${e.message}</p>`;
            }
        }

        function renderProducts(cat) {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            const filtered = cat === 'all' ? allProducts : allProducts.filter(p => p.category === cat);
            
            if(filtered.length === 0) {
                grid.innerHTML = '<p class="text-center col-span-full text-white/50 py-20">لا توجد منتجات في هذا القسم حالياً 😔</p>';
                return;
            }

            filtered.forEach(p => {
                const isAvailable = Number(p.quantity) > 0;
                const imgUrl = p.image ? pb.files.getUrl(p, p.image) : `https://via.placeholder.com/400x500?text=${p.name}`;
                
                grid.innerHTML += `
                    <div class="product-card ultra-glass rounded-3xl p-3 group relative">
                        <div class="relative h-56 md:h-72 rounded-2xl overflow-hidden mb-3">
                            <img src="${imgUrl}" class="w-full h-full object-cover group-hover:scale-110 transition-duration-500">
                            <div class="absolute top-2 left-2">
                                <span class="${isAvailable ? 'bg-emerald-500' : 'bg-red-500'} text-[10px] px-2 py-1 rounded-full font-bold">
                                    ${isAvailable ? 'متوفر ✅' : 'نفذت الكمية ❌'}
                                </span>
                            </div>
                        </div>
                        <div class="px-1">
                            <h4 class="font-bold truncate">${p.name}</h4>
                            <p class="text-[10px] text-white/40 mb-2 truncate">${p.description || 'لا يوجد وصف'}</p>
                            <p class="text-[10px] text-emerald-400 mb-2">🏪 ${p.shopName}</p>
                            <div class="flex justify-between items-center">
                                <span class="text-lg font-bold text-fuchsia-400">${p.price} د.ع</span>
                                ${isAvailable ? 
                                    `<button onclick="addToCart('${p.id}', '${p.name}', ${p.price}, '${p.shopName}')" class="bg-white/10 p-2 rounded-full hover:bg-violet-600 transition">➕</button>` 
                                    : `<span class="text-red-500 text-xs font-bold">غير متاح</span>`}
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        window.filterCategory = (cat) => {
            document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            loadProducts(cat);
        };

        window.toggleCart = () => document.getElementById('cartDrawer').classList.toggle('-translate-x-full');

        window.addToCart = (id, name, price, shop) => {
            cart.push({id, name, price, shop});
            updateCartUI();
        };

        function updateCartUI() {
            document.getElementById('cartCount').innerText = cart.length;
            const cartDiv = document.getElementById('cartItems');
            let total = 0;
            cartDiv.innerHTML = cart.map((item, index) => {
                total += Number(item.price);
                return `<div class="bg-white/5 p-4 rounded-2xl flex justify-between items-center border border-white/5">
                    <div><p class="font-bold text-sm">${item.name}</p><p class="text-[10px] text-white/40">من: ${item.shop}</p></div>
                    <div class="flex items-center gap-3"><span class="text-fuchsia-400 font-bold">${item.price}</span><button onclick="removeFromCart(${index})" class="text-red-500">🗑️</button></div>
                </div>`;
            }).join('');
            document.getElementById('totalPrice').innerText = total + " د.ع";
        }

        window.removeFromCart = (index) => { cart.splice(index, 1); updateCartUI(); };

        window.confirmOrder = async () => {
            if(cart.length === 0) return alert("السلة فارغة!");
            const address = prompt("أدخل عنوان التوصيل بالتفصيل:");
            if(!address) return;

            const ordersByShop = {};
            cart.forEach(item => {
                if(!ordersByShop[item.shop]) ordersByShop[item.shop] = [];
                ordersByShop[item.shop].push(item);
            });

            try {
                for (let shop in ordersByShop) {
                    const shopItems = ordersByShop[shop];
                    const total = shopItems.reduce((sum, i) => sum + Number(i.price), 0);
                    await pb.collection('orders').create({
                        shopName: shop,
                        customerName: user.name,
                        customerPhone: user.phone,
                        customerAddress: address,
                        items: JSON.stringify(shopItems),
                        totalPrice: total,
                        status: "قيد التجهيز"
                    });
                }
                alert("تم إرسال طلباتك بنجاح! 🎉");
                cart = []; updateCartUI(); toggleCart();
            } catch (e) { alert("خطأ: " + e.message); }
        };
    </script>
</body>
</html>
